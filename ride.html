<body>

    <div class="controls-bar">
        <div class="btn-group" role="group">
            <button id="setPickup" class="btn btn-primary btn-sm">
                <i class="glyphicon glyphicon-map-marker"></i> Set Pickup
            </button>
            <button id="setDropoff" class="btn btn-danger btn-sm">
                <i class="glyphicon glyphicon-flag"></i> Set Drop-off
            </button>
            <button id="resetLocations" class="btn btn-warning btn-sm">
                <i class="glyphicon glyphicon-refresh"></i> Reset
            </button>
        </div>

        <button id="request" class="btn btn-success btn-lg" disabled>
            Request Ride
        </button>

        <button id="newRide" class="btn btn-info btn-lg" style="display:none;">
            New Ride
        </button>

        <button id="showHistory" class="btn btn-info btn-sm">
            <i class="glyphicon glyphicon-list"></i> My Rides
        </button>
        
        <!-- Account dropdown (kept but modernized) -->
        <div class="dropdown account-dropdown">
            <button id="accountLink" class="btn btn-link dropdown-toggle" type="button" data-toggle="dropdown">
                <span class="glyphicon glyphicon-user"></span> Account
                <span class="caret"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-right">
                <li><a id="signOut" href="#">Sign out</a></li>
            </ul>
        </div>
    </div>

    <!-- Updates panel (moved outside heading for better layout) -->
    <div class="info-panel">
        <div class="panel-heading">Ride Updates</div>
        <div class="panel-body">
            <ul id="updates" class="updates-list"></ul>
        </div>
    </div>

    <div id="main">
        <div id="map">
        </div>
    </div>

    <div id="authTokenModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="authToken">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">Your Auth Token</h4>
                </div>
                <div class="modal-body">
                    <textarea class="authToken"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Amazon Lex Chatbot Widget -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-lex-web-ui@2.0.0/dist/lex-web-ui.min.js"></script>
    
    <style>
      #lex-chat-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 10000;
        width: 380px;
        height: 650px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        background: white;
      }
    </style>
    
    <div id="lex-chat-container"></div>
    
    <script>
      const botId = "PBE6TNFJB7";        // ← Put your Bot ID
      const aliasId = "TSTALIASID";            // Usually this one
    
      const lexWebUi = new LexWebUi({
        bot: {
          botId: botId,
          aliasId: aliasId,
          localeId: "en_US",
          region: "ap-southeast-1"
        },
        ui: {
          header: {
            title: "ShareX Ride Assistant",
            subtitle: "Ask me to book a ride"
          },
          chat: {
            placeholder: "Type here... (e.g. book a ride)"
          }
        }
      });
    
      lexWebUi.mount(document.getElementById('lex-chat-container'));
    
      // Auto open after 1.5 seconds
      setTimeout(() => {
        lexWebUi.show();
      }, 1500);
    </script>
    <script src="js/vendor/jquery-3.1.0.js"></script>
