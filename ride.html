    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>

  <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1490.0.min.js"></script>

  <style>
    /* ==================== MODERN DRAGGABLE CHATBOT UI ==================== */
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
    }

    /* Main Chat Container - Small & on the Left */
    #chat-container {
      position: fixed;
      left: 20px;
      top: 80px;
      width: 320px;
      height: 480px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      border: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      resize: both; /* optional: allow user to resize */
      min-width: 280px;
      min-height: 300px;
    }

    /* Header - Draggable Area */
    #chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move; /* indicates draggable */
      user-select: none;
    }

    #chat-header .title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #chat-header .status {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Messages Area */
    #messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #messages div {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      font-size: 14.5px;
      word-wrap: break-word;
    }

    #messages div b {
      font-size: 13px;
      opacity: 0.8;
    }

    /* User Message */
    #messages div:nth-child(odd) {
      align-self: flex-end;
      background: #667eea;
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* Bot Message */
    #messages div:nth-child(even) {
      align-self: flex-start;
      background: white;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    /* Input Area */
    #input-area {
      padding: 12px;
      background: white;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 30px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    #input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    #send-btn {
      width: 44px;
      height: 44px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    #send-btn:hover {
      background: #5a6fd8;
    }

    /* Scrollbar Styling */
    #messages::-webkit-scrollbar {
      width: 6px;
    }
    #messages::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="chat-header">
      <div class="title">
        <span>🤖</span>
        <span>AI Assistant</span>
      </div>
      <span class="status">● Online</span>
    </div>

    <div id="messages"></div>

    <div id="input-area">
      <input type="text" id="input" placeholder="Type your message..." autocomplete="off">
      <button id="send-btn" onclick="sendMessage()">↑</button>
    </div>
  </div>

  <script>
    AWS.config.region = "ap-south-1";

    AWS.config.credentials = new AWS.CognitoIdentityCredentials({
      IdentityPoolId: "ap-south-1:280780db-65ae-4a79-a33d-97ac27a0f5c2"
    });

    const lex = new AWS.LexRuntimeV2({ region: "ap-southeast-1" });

    function addMessage(sender, text) {
      const div = document.createElement("div");
      div.innerHTML = "<b>" + sender + ":</b> " + text;
      document.getElementById("messages").appendChild(div);
      div.scrollIntoView({ behavior: "smooth" });
    }

    function sendMessage() {
      const input = document.getElementById("input");
      const text = input.value.trim();

      if (!text) return;

      addMessage("You", text);
      input.value = "";

      lex.recognizeText({
        botId: "PBE6TNFJB7",
        botAliasId: "TSTALIASID",
        localeId: "en_US",
        sessionId: "user123",
        text: text
      }, function(err, data) {
        if (err) {
          addMessage("Error", "Something went wrong");
          console.error(err);
          return;
        }

        const reply = data.messages?.[0]?.content || "No response";
        addMessage("Bot", reply);
      });
    }

    // Allow pressing Enter to send
    document.getElementById("input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const header = document.getElementById('chat-header');

    let isDragging = false;
    let currentX, currentY, initialX, initialY;

    header.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return; // don't drag when clicking buttons

      isDragging = true;
      initialX = e.clientX - currentX;
      initialY = e.clientY - currentY;
    });

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        e.preventDefault();
        currentX = e.clientX - initialX;
        currentY = e.clientY - initialY;

        chatContainer.style.left = currentX + 'px';
        chatContainer.style.top = currentY + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Initialize position
    currentX = 20;
    currentY = 80;
  </script>

</body>
</html>
    <script src="js/vendor/jquery-3.1.0.js"></script>
    <script src="js/vendor/bootstrap.min.js"></script>
    <script src="js/vendor/aws-cognito-sdk.min.js"></script>
    <script src="js/vendor/amazon-cognito-identity.min.js"></script>
    <script src="https://js.arcgis.com/4.6/"></script>
    <script src="js/config.js"></script>
    <script src="js/cognito-auth.js"></script>
    <script src="js/esri-map.js"></script>
    <script src="js/ride.js"></script>
</body>
