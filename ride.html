<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>ShareX</title>
    <!-- Place favicon1.ico and apple-touch-icon.png in the root directory -->
    <link rel="icon" type="image/png" href="images/wr-home-SX.jpg">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Serverless web application example">
    <meta name="author" content="">


    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link rel="stylesheet" href="https://js.arcgis.com/4.6/esri/css/main.css">
    <link rel="stylesheet" href="/css/ride.css">
    <link rel="stylesheet" href="/css/message.css">
</head>

<body>

    <div class="controls-bar">
        <div class="btn-group" role="group">
            <button id="setPickup" class="btn btn-primary btn-sm">
                <i class="glyphicon glyphicon-map-marker"></i> Set Pickup
            </button>
            <button id="setDropoff" class="btn btn-danger btn-sm">
                <i class="glyphicon glyphicon-flag"></i> Set Drop-off
            </button>
            <button id="resetLocations" class="btn btn-warning btn-sm">
                <i class="glyphicon glyphicon-refresh"></i> Reset
            </button>
        </div>

        <button id="request" class="btn btn-success btn-lg" disabled>
            Request Ride
        </button>

        <button id="newRide" class="btn btn-info btn-lg" style="display:none;">
            New Ride
        </button>

        <button id="showHistory" class="btn btn-info btn-sm">
            <i class="glyphicon glyphicon-list"></i> My Rides
        </button>
        
        <!-- Account dropdown (kept but modernized) -->
        <div class="dropdown account-dropdown">
            <button id="accountLink" class="btn btn-link dropdown-toggle" type="button" data-toggle="dropdown">
                <span class="glyphicon glyphicon-user"></span> Account
                <span class="caret"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-right">
                <li><a id="signOut" href="#">Sign out</a></li>
            </ul>
        </div>
    </div>

    <!-- Updates panel (moved outside heading for better layout) -->
    <div class="info-panel">
        <div class="panel-heading">Ride Updates</div>
        <div class="panel-body">
            <ul id="updates" class="updates-list"></ul>
        </div>
    </div>
    <div id="main">
        <div id="map">
        </div>
    </div>

    <div id="authTokenModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="authToken">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabel">Your Auth Token</h4>
                </div>
                <div class="modal-body">
                    <textarea class="authToken"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <div id="lex-chat-container"></div> 
    <!-- Amazon Lex Chatbot Widget -->
    <style>
      #lex-chat-container {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 10000;
        width: 340px;
        height: 360px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        overflow: hidden;
        background: white;
        border: 1px solid #ddd;
        display: flex;
        flex-direction: column;
      }
    
      #lex-header {
        background: #232f3e;
        color: white;
        padding: 12px;
        font-weight: bold;
      }
    
      #lex-messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        background: #f8f9fa;
      }
    
      #lex-input-area {
        padding: 10px;
        border-top: 1px solid #ddd;
        display: flex;
      }
    
      #lex-input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #ccc;
        border-radius: 25px;
      }
    
      #lex-send {
        margin-left: 8px;
        padding: 0 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
      }
    
      .message {
        margin: 10px 0;
        max-width: 85%;
      }
    
      .user-message { text-align: right; }
      .bot-message { text-align: left; }
    
      .bubble {
        display: inline-block;
        padding: 10px 15px;
        border-radius: 18px;
        line-height: 1.4;
      }
    
      .user-bubble { background: #007bff; color: white; }
      .bot-bubble { background: #e9ecef; color: #333; }
    </style>
    
    <div id="lex-chat-container">
      <div id="lex-header">ShareX Assistant 🦄</div>
      <div id="lex-messages"></div>
      <div id="lex-input-area">
        <input type="text" id="lex-input" placeholder="Type here... (e.g. book a ride)" />
        <button id="lex-send">Send</button>
      </div>
    </div>
    
    <script>
      const botId = "PBE6TNFJB7";
      const aliasId = "TSTALIASID";
      const region = "ap-southeast-1";
    
      const messagesDiv = document.getElementById('lex-messages');
      const input = document.getElementById('lex-input');
      const sendBtn = document.getElementById('lex-send');
    
      function addMessage(text, isUser) {
        const div = document.createElement('div');
        div.className = isUser ? 'message user-message' : 'message bot-message';
        div.innerHTML = `<div class="bubble ${isUser ? 'user-bubble' : 'bot-bubble'}">${text}</div>`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    
      async function sendToLex(text) {
        addMessage(text, true);
    
        try {
          const credentials = AWS.config.credentials;
          if (!credentials) {
            addMessage("Please log in first to use the chatbot.", false);
            return;
          }
    
          await new Promise(resolve => credentials.get(resolve));
    
          const response = await fetch(`https://runtime-v2-lex.${region}.amazonaws.com/bots/${botId}/botAliases/${aliasId}/botLocales/en_US/sessions/${Date.now()}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Amz-Security-Token': credentials.sessionToken
            },
            body: JSON.stringify({
              text: text,
              localeId: "en_US"
            })
          });
    
          const data = await response.json();
    
          if (data.messages) {
            data.messages.forEach(msg => {
              if (msg.content) addMessage(msg.content, false);
            });
          }
        } catch (err) {
          console.error(err);
          addMessage("Sorry, the chatbot is temporarily unavailable.", false);
        }
      }
    
      sendBtn.addEventListener('click', () => {
        const text = input.value.trim();
        if (text) {
          sendToLex(text);
          input.value = '';
        }
      });
    
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendBtn.click();
      });
    
      // Welcome message
      setTimeout(() => {
        addMessage("Hello! How can I help you book a ride today? 🦄", false);
      }, 800);
    </script>
    <script src="js/vendor/jquery-3.1.0.js"></script>
    <script src="js/vendor/bootstrap.min.js"></script>
    <script src="js/vendor/aws-cognito-sdk.min.js"></script>
    <script src="js/vendor/amazon-cognito-identity.min.js"></script>
    <script src="https://js.arcgis.com/4.6/"></script>
    <script src="js/config.js"></script>
    <script src="js/cognito-auth.js"></script>
    <script src="js/esri-map.js"></script>
    <script src="js/ride.js"></script>
</body>

</html>
